# Render Blueprint — backend only. The Next.js frontend deploys to Vercel;
# see docs/DEPLOYMENT.md for the order the two have to be brought up in.
# Values marked `sync: false` are entered once in the Render dashboard.
services:
  - type: web
    name: aftermeet-api
    runtime: node
    plan: free # free instances spin down when idle; first request after that is slow
    region: oregon # match your Supabase region
    rootDir: backend/api
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"

      # Render injects PORT and expects the process to bind it; main.ts reads it.
      - key: DATABASE_URL # Supabase pooler URI, port 6543, ?pgbouncer=true
        sync: false
      - key: DIRECT_URL # Supabase direct URI, port 5432 (migrations)
        sync: false

      # Comma-separated origins. Set to your Vercel URL once the frontend is up.
      # meet.google.com and *.zoom.us are always allowed by pattern in main.ts.
      - key: CORS_ORIGINS
        sync: false
      # Must be byte-identical to API_JWT_SECRET on Vercel.
      - key: API_JWT_SECRET
        sync: false
      - key: WEB_APP_URL # Vercel URL; Stripe redirects back here
        sync: false

      # Transcription + extraction. Groq alone is enough to run the whole app.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: GEMINI_API_KEY # optional fallback
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: OPENAI_API_KEY # optional fallback
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-2024-11-20
      - key: OPENAI_TRANSCRIBE_MODEL
        value: whisper-1

      # Billing. Point the Stripe webhook at <backend>/billing/webhook.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false

      # Same OAuth client as the frontend — used to refresh the Docs export token.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
